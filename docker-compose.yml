services:
  torbox-library-sync:
    build: .
    container_name: torbox-library-sync
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - NODE_ENV=production
      - PORT=7000
      - HOST=0.0.0.0
      # Optional: set personal keys here for zero-config single-user mode:
      # - TORBOX_API_KEY=your_torbox_api_key_here
      # - MDBLIST_API_KEY=your_mdblist_api_key_here
      # - TVDB_API_KEY=your_tvdb_api_key_here
      # - ENCRYPTION_KEY=custom_master_encryption_secret_here
