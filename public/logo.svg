<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="tbTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tbLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tbRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="64" height="64" rx="14" fill="#090d14"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Isometric Cube Geometry -->
  <!-- Top Lid (The Box Cap) -->
  <path d="M32 10 L52 21 L32 32 L12 21 Z" fill="url(#tbTop)"/>
  
  <!-- Left Body Facet -->
  <path d="M12 24 L30 34 L30 54 L12 44 Z" fill="url(#tbLeft)"/>
  
  <!-- Right Body Facet -->
  <path d="M34 34 L52 24 L52 44 L34 54 Z" fill="url(#tbRight)"/>
  
  <!-- Integrated Sync Arrows (Negative Space & Pure Geometry) -->
  <!-- Upper Right Sync Arrowhead -->
  <path d="M32 18 L42 23.5 L36 26.8 L32 24.6 Z" fill="#ffffff"/>
  
  <!-- Central Vertical Flow Indicator -->
  <path d="M32 30 L36 34 L34 34 L34 44 L30 44 L30 34 L28 34 Z" fill="#ffffff" opacity="0.95"/>
</svg>
